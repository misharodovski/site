<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Истая Кузница</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
    .nf img { width: 120px; margin: 0 auto 30px; animation: plGlow 2.4s ease-in-out infinite alternate; }
    .nf h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(80px, 14vw, 160px); line-height: 1; margin: 0; color: var(--copper-2); }
    .nf p { color: var(--muted); margin: 10px 0 36px; text-transform: uppercase; letter-spacing: .2em; font-size: 12px; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <img src="/img/logo-emblem.png" alt="">
      <h1>404</h1>
      <p>Эта страница ещё не выкована</p>
      <a class="btn btn--outline" href="/">На главную <i class="arrow"></i></a>
    </div>
  </main>
</body>
</html>
