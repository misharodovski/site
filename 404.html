<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Истая Кузница</title>
  <meta name="robots" content="noindex">
  <!-- Страница самодостаточная (без внешних файлов): работает и в корне домена, и в подпапке (GitHub Pages /site/) -->
  <style>
    :root { --bg: #0e0c0b; --text: #efe8df; --muted: #a89e93; --fire: #e07a2f; --fire-2: #ffb25b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 16px;
      background: radial-gradient(60% 50% at 50% 100%, rgba(224,122,47,.25), transparent 70%), var(--bg);
      color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    b { display: block; font: 700 clamp(110px, 22vw, 220px)/.9 Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, var(--fire-2), #b4521a); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font: 600 clamp(28px, 4vw, 40px)/1.1 Georgia, "Times New Roman", serif; margin: 12px 0 14px; }
    p { color: var(--muted); margin: 0 0 28px; }
    a { display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border-radius: 999px; text-decoration: none; font-weight: 600;
      color: #1a0d04; background: linear-gradient(135deg, var(--fire-2), var(--fire) 55%, #b4521a); }
  </style>
</head>
<body>
  <main>
    <b>404</b>
    <h1>Эта страница остыла</h1>
    <p>Похоже, ссылка устарела или в адресе опечатка.</p>
    <a id="home" href="/">На главную</a>
  </main>
  <script>
    // на GitHub Pages сайт лежит в подпапке /site/
    if (/\.github\.io$/.test(location.hostname)) {
      var seg = location.pathname.split('/')[1];
      if (seg) document.getElementById('home').href = '/' + seg + '/';
    }
  </script>
</body>
</html>
